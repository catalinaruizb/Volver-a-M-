/* Layout: una sola escena centrada; el sobre se abre en 3D y la tarjeta sale del bolsillo. Pieza de un solo look (crema), sin modo oscuro. */
:root {
  color-scheme: light;
  --crema: #FBFBEA; --papel: #F3EED8; --olivo: #777340; --rojo: #BE383A; --rosado: #F6DDDD; --amarillo: #FCD891;
  --script: "Maison VAM", "Yellowtail", cursive;
  --text: "Avenir VAM", "Nunito Sans", system-ui, sans-serif;
  --pw: min(42vw, 290px, calc((100svh - 250px) / 1.456)); --ph: calc(var(--pw) * 1.456);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--crema); color: var(--olivo); font-family: var(--text); font-weight: 300; overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding-block: 28px 22px; gap: 12px; }
.para { text-align: center; }
.para small { display: block; letter-spacing: .28em; font-size: .72rem; font-weight: 400; color: var(--olivo); }
.para .s { font-family: var(--script); color: var(--rojo); font-size: clamp(2.6rem, 9vw, 4rem); line-height: 1.25; padding-inline: .15em; word-spacing: -.1em; display: block; }
.stage { position: relative; width: calc(var(--pw) * 2); height: calc(var(--ph) + 60px); perspective: 1600px; align-self: center; }
.env { position: absolute; left: 0; top: 30px; width: calc(var(--pw) * 2); height: var(--ph); transform-style: preserve-3d;
  transform: translateX(calc(var(--pw) * -0.5)); transition: transform 1.1s cubic-bezier(.6,.05,.2,1); cursor: pointer; }
.env.open { transform: translateX(0); cursor: default; }
.shadow { position: absolute; left: calc(var(--pw) * 1 + 6px); top: 14px; width: var(--pw); height: var(--ph); background: rgba(90,60,30,.28); filter: blur(18px); transform: translateZ(-4px); transition: left 1.1s cubic-bezier(.6,.05,.2,1), width 1.1s; }
.env.open .shadow { left: 6px; width: calc(var(--pw) * 2); }
.panel { position: absolute; top: 0; width: var(--pw); height: var(--ph); background-size: 100% 100%; }

const $ = s => document.querySelector(s);
const env = $("#env"), card = $("#card");
$("#toName").textContent = NAME;
$("#cardName").textContent = NAME;
$("#cardName").style.fontSize = NAME.length > 8 ? "12.6cqw" : "15.4cqw";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? 10 : ms));
let busy = false, big = null;
async function openEnv() {
  if (busy || env.classList.contains("open")) return; busy = true;
  $("#hint").style.opacity = 0;
  env.classList.add("open"); await wait(1150);
  env.classList.add("lift"); await wait(950);
  showBig(); busy = false;
}
function showBig() {
  const r = card.getBoundingClientRect();
  big = card.cloneNode(true); big.removeAttribute("id"); big.className = "big";
  Object.assign(big.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  document.body.appendChild(big); card.style.visibility = "hidden";
  const vw = innerWidth, vh = innerHeight;
  const w = Math.min(vw - 32, 430, (vh - 120) * 1103 / 1606), h = w * 1606 / 1103;
  const x = (vw - w) / 2, y = Math.max(16, (vh - h) / 2 - 24);
  $("#overlay").classList.add("on");
  big.animate([{ left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", transform: "rotate(0)" },
               { left: x + "px", top: y + "px", width: w + "px", height: h + "px", transform: "rotate(-1.5deg)" }],
              { duration: reduce ? 1 : 900, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
  setTimeout(() => { confetti(); $("#tools").classList.add("on"); }, reduce ? 0 : 700);
}
function confetti() {
  if (reduce) return;
  for (let i = 0; i < 26; i++) {
    const c = document.createElement("img"); c.className = "conf"; c.alt = ""; c.src = ELS[i % ELS.length];
    const x = Math.random() * innerWidth, s = 18 + Math.random() * 26;
    Object.assign(c.style, { left: x + "px", top: (-40 - Math.random() * 120) + "px", width: s + "px" });
    c.style.setProperty("--dx", (Math.random() - .5) * 160 + "px"); c.style.setProperty("--dy", innerHeight + 200 + "px");
    c.style.setProperty("--r", (Math.random() * 540 - 270) + "deg"); c.style.setProperty("--d", (2.4 + Math.random() * 1.8) + "s");
    c.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(c); setTimeout(() => c.remove(), 5200);
  }
}
function reset() {
  if (big) { big.remove(); big = null; }
  card.style.visibility = ""; $("#overlay").classList.remove("on"); $("#tools").classList.remove("on");
  env.classList.remove("lift", "open"); $("#hint").style.opacity = 1;
}
env.addEventListener("click", openEnv);
env.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnv(); } });
$("#again").addEventListener("click", () => { reset(); setTimeout(openEnv, 700); });
$("#overlay").addEventListener("click", () => { reset(); });
</script>
